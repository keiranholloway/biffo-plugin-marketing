[project]
name = "biffo-plugin-marketing"
version = "0.1.0"
description = "Example Biffo plugin — replace this with your own plugin's name and description"
requires-python = ">=3.13"
dependencies = [
  # biffo-plugin-sdk has a real release path as of biffo-template's
  # .github/workflows/publish-sdk.yml: the package is versioned 1.0.0 and
  # publishes to PyPI (via Trusted Publishing) when an `sdk-v*` tag is
  # pushed. This pin is therefore the *correct end state* and is left as-is.
  #
  # ORDERING: the pin only resolves once the owner has actually pushed
  # `sdk-v1.0.0` and PyPI has the release. Until that first publish,
  # `uv sync` in a freshly-copied plugin repo cannot resolve it — the same
  # as before this comment was written, so nothing regressed here; what
  # changed is that the fix is now one tag push away rather than unbuilt.
  # Deliberately NOT worked around with a git/path source in the committed
  # file: baking one in would mean every plugin repo forked from this
  # skeleton silently keeps building against a moving git ref long after
  # the real release exists. Use a local `[tool.uv.sources]` override until
  # then — see the README's "biffo-plugin-sdk dependency" section, which
  # documents both options and says which to delete once 1.0.0 is live.
  "biffo-plugin-sdk>=1.0,<2.0",
  "aws-lambda-powertools[tracer]>=3.4.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
  "jsonschema>=4.23.0",
  "pip-audit>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit rather than relying on hatchling's default "package name matches
# a src/ directory" heuristic — the project name (`biffo-plugin-marketing`)
# is a distribution/PyPI name, while `marketing` is the importable
# package name; they don't have to match, and won't once you rename this
# template's package to your own plugin's name. Update this path when you do.
packages = ["src/marketing"]

[tool.ruff]
target-version = "py313"
line-length = 100

# Match the select an instance actually enforces once this plugin is vendored
# into services/<name>/ — the instance applies it with no third-party carve-out,
# so a skeleton that is *stricter* makes an author write annotations nobody asked
# for, and one that is looser lets a plugin pass its own CI and fail the tree it
# lands in. Keep in step with the template root and biffo-plugin-ideation
# (issue #650).
#
# ANN is deliberately absent for that reason. It is also actively wrong in one
# place: ANN401 rejects the `Any` in a Pydantic mode="before" validator, which
# is the one signature where `Any` is genuinely correct.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP"]
ignore = [
  "S101", # allow assert in tests
]

# FastAPI's dependency-injection defaults are the framework's idiomatic
# call-in-default pattern, not the B008 mutable-default bug. Without this a
# plugin cannot write `x = Depends(...)` — the mandatory idiom for any plugin
# exposing routes — and B008 reddens its CI on the first endpoint it adds.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the normal pytest idiom. S106: fakes.py's mock
# BiffoAPIClient(token=...) is a fixed test fixture value, not a real
# credential. (ANN is no longer selected, so it needs no per-file ignore.)
"tests/**/*.py" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

# python-semantic-release config for release.yml. This repo does not use
# semantic-release to *create* tags (unlike its most common setup) — it's
# triggered by an already-pushed `v*` tag instead (see release.yml's header
# comment), so only `version_toml` (for the tag/pyproject.toml consistency
# check) and changelog generation are used; `semantic-release version`'s own
# commit/tag/push behavior is never invoked in CI.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "uv build"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
