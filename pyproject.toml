[project]
name = "biffo-plugin-marketing"
version = "0.1.0"
description = "Campaign studio — research, positioning, channel planning, generation and attribution for platform marketing."
requires-python = ">=3.13"
dependencies = [
  # [user-serving] brings FastAPI and the `require_group` gate the admin
  # surface mounts behind; [sigv4] signs this plugin's own outbound calls to
  # Core's internal API so it is granted `system:marketing` rather than the
  # host's role identity (ADR-0021 section 1a). Same pins as idea-scout, the
  # other user-facing plugin.
  #
  # >=1.2 (not >=1.1): 1.2.0 is the first release carrying
  # `SignedCoreClient.raw_request(..., extra_signed_headers=...)` — the
  # dual-auth (SigV4 + forwarded user token) mechanism this plugin's
  # `principal_client` module depends on for every call to Core's internal,
  # per-plugin CRUD mount (issue #27, keiranholloway/biffo-template#1480).
  # >=1.3 because `principal_client` now builds on the SDK's own
  # `PrincipalCoreClient` (added in 1.3.0, keiranholloway/biffo-template#1490)
  # rather than hand-rolling the same dual-auth mechanism locally.
  # Confirmed live on PyPI (releases: 1.0.0, 1.1.0, 1.2.0, 1.3.0) before this
  # pin was bumped, so `uv sync` resolves it with no local
  # `[tool.uv.sources]` override needed.
  "biffo-plugin-sdk[sigv4,user-serving]>=1.3,<2.0",
  "aws-lambda-powertools[tracer]>=3.4.0",
  # Already present for the SDK; also used by admin_app to call Core directly —
  # one hop, rather than the host calling itself through the public path.
  "httpx>=0.28.1",
  # Declared rather than assumed from the Lambda runtime, matching
  # services/_plugins/agent-runtime. AWS does ship boto3, but relying on that
  # makes the dependency invisible to pyright and to pip-audit, and pins the
  # version to whatever AWS happens to be running that week. Used only by
  # config.py, to read one SSM parameter.
  "boto3>=1.35.0",
  # Used only by render.py, to centre-crop the one approved creative into
  # each placement's exact aspect ratio. Pillow, not a model call — see
  # render.py's module docstring for why regenerating per placement is the
  # thing this module exists to avoid.
  "pillow>=11.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
  "jsonschema>=4.23.0",
  "pip-audit>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit rather than relying on hatchling's default "package name matches
# a src/ directory" heuristic — the project name (`biffo-plugin-marketing`)
# is a distribution/PyPI name, while `marketing` is the importable
# package name; they don't have to match, and won't once you rename this
# template's package to your own plugin's name. Update this path when you do.
packages = ["src/marketing"]

[tool.ruff]
target-version = "py313"
line-length = 100

# Match the select an instance actually enforces once this plugin is vendored
# into services/<name>/ — the instance applies it with no third-party carve-out,
# so a skeleton that is *stricter* makes an author write annotations nobody asked
# for, and one that is looser lets a plugin pass its own CI and fail the tree it
# lands in. Keep in step with the template root and biffo-plugin-ideation
# (issue #650).
#
# ANN is deliberately absent for that reason. It is also actively wrong in one
# place: ANN401 rejects the `Any` in a Pydantic mode="before" validator, which
# is the one signature where `Any` is genuinely correct.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP"]
ignore = [
  "S101", # allow assert in tests
]

# FastAPI's dependency-injection defaults are the framework's idiomatic
# call-in-default pattern, not the B008 mutable-default bug. Without this a
# plugin cannot write `x = Depends(...)` — the mandatory idiom for any plugin
# exposing routes — and B008 reddens its CI on the first endpoint it adds.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the normal pytest idiom. S106: fakes.py's mock
# BiffoAPIClient(token=...) is a fixed test fixture value, not a real
# credential. (ANN is no longer selected, so it needs no per-file ignore.)
"tests/**/*.py" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

# python-semantic-release config for release.yml. This repo does not use
# semantic-release to *create* tags (unlike its most common setup) — it's
# triggered by an already-pushed `v*` tag instead (see release.yml's header
# comment), so only `version_toml` (for the tag/pyproject.toml consistency
# check) and changelog generation are used; `semantic-release version`'s own
# commit/tag/push behavior is never invoked in CI.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "uv build"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
