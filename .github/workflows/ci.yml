name: CI

# Scaled down from biffo-template's own root .github/workflows/ci.yml for a
# plugin repo (per ADR-0003) whose main package is Python.
#
# It is NOT Python-only. This comment used to say the repo "has no JS/TS of its
# own" while `web-admin/` sat beside it with 108 vitest tests, a typecheck, a
# lint config and a Vite build — none of which any job ran (#97). That is the
# same shape as the Terraform paragraph below: an untrue sentence in the file
# that decides what gets checked is exactly why nothing checked it. See the
# `admin-frontend` job.
#
# It DOES have Terraform. This comment used to claim the opposite — "no
# Terraform of its own; Terraform, if a plugin ships any, is provisioned by the
# consuming project's infra, not this repo's CI" — while the skeleton beside it
# shipped a whole `terraform/` module, and that untrue sentence is exactly why
# nothing checked it (#1244). What the consuming project provisions is the
# module's *instantiation*; the module's own source lives here, is edited here,
# and is only ever checked here. See the `terraform` job below.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # A self-hosted spot runner that is reclaimed mid-job leaves the job hanging
    # rather than failing: on 2026-07-30 five jobs across two PRs died with
    # "The runner has received a shutdown signal", and without a timeout a job
    # whose runner simply vanishes burns the 360-minute default before anyone
    # is told. 20m is ~4x the slowest job observed across this repo and
    # biffo-platform (JS, 5.4m), so a cold cache or a large PR will not trip it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pyright

  test:
    name: Test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # video_assembly.py's determinism tests (tests/test_marketing_video_assembly.py)
      # skip — not fail — when no `ffmpeg` binary is on PATH, so a runner
      # image without one would make this job report green having actually
      # run zero of them. ubuntu-latest ships ffmpeg preinstalled, so this is
      # a no-op there; it only does real work the day RUNNER_LABEL routes this
      # repo to a self-hosted image that doesn't (see AGENTS.md #9 — that
      # switch happens outside this repo's control).
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: uv sync --all-groups
      # `--cov-report=json` is not a second copy of the xml for Codecov's
      # benefit — `scripts/error_branch_coverage.py` reads `coverage.json` and
      # nothing else, so without this line the step below has no input and
      # exits 2 ("no coverage data"), which is the gate failing to run rather
      # than the gate passing. Same pairing the instance's `ci.yml` uses.
      - run: uv run pytest --cov --cov-report=xml --cov-report=json
      # Fails only when error handling is ADDED with nothing exercising it
      # (#183; the check itself is keiranholloway/biffo-template#956). An
      # unexecuted `except` is unverified — nobody has ever observed what it
      # does — and that is where every fail-open this estate has found actually
      # lived.
      #
      # ## Why this repo grew it late, and what it cost
      #
      # This is a ratchet the INSTANCE has run for months and this repo ran not
      # at all. Not a narrower version of it — none: `gh pr checks 180` listed
      # twelve contexts and `Error-branch coverage` was not among them. The
      # analyser is template-owned (`biffo-template/scripts/`) and reaches an
      # instance through `biffo core upgrade`; it is absent from that repo's
      # `shared-files.json` AND from the `@biffo/cli` package `scripts/biffo.sh`
      # resolves, so there was no channel by which a satellite could ever have
      # received it (the class biffo-template#1570 records: "merged upstream"
      # and "present downstream" are different facts).
      #
      # The bill came due on PR #180, which added an `except Exception` to
      # `scripts/check_runtime_ceiling.py` converting any AWS failure into
      # `CannotReadError`, went green on every check here, and then reddened
      # tabsii-platform the moment `biffo plugin install` vendored it:
      #
      #   1 error branch(es) added with no test exercising them:
      #     services/marketing/scripts/check_runtime_ceiling.py:except:except Exception
      #
      # A gate that only exists one repo downstream of the author is a gate
      # that reports to the wrong person.
      #
      # ## No `hashFiles('.github/workflows/rls-tests.yml')` guard here
      #
      # The instance's copy of this step carries one, because a repo with a
      # real-Postgres lane has error branches this job structurally cannot
      # execute, and its combined assertion happens once in
      # `error-branch-coverage-gate.yml` instead. A plugin repo has neither
      # file, so replicating the guard would buy nothing and cost something
      # real: if an `rls-tests.yml` ever appeared here the condition would
      # silently skip this step and NOTHING would take over the assertion — a
      # fail-open dressed as a deliberate narrowing. Instead the condition is
      # absent and `tests/test_marketing_error_branch_gate.py` asserts this
      # repo still has no RLS lane, so the day one arrives the test goes red and
      # names this decision rather than the gate going quiet.
      #
      # `scripts/error_branch_coverage.py` is byte-identical to
      # `biffo-template/scripts/error_branch_coverage.py`. Do not edit it here;
      # edit it upstream — the same rule `scripts/py-dependency-audit.sh`
      # already carries.
      - name: Error-branch coverage
        run: uv run python scripts/error_branch_coverage.py --check --coverage coverage.json
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage.xml

  # `web-admin/` is the plugin's entire operator surface, and until #97 nothing
  # in CI entered it: every job above runs `uv` at the repo root, and the admin
  # UI is a nested pnpm project with its own package.json and lockfile, so no
  # root-level command reaches it. A PR could break all of its tests, fail
  # typecheck and merge green — the whole of it was gated by whether the person
  # or agent making the change happened to run pnpm by hand.
  #
  # Kept deliberately in step with the same job in biffo-plugin-idea-scout
  # (`admin-frontend`, same name and same steps), so a plugin's admin UI is
  # checked identically wherever it lives.
  #
  # ## No `paths:` filter, on purpose
  #
  # Every other job here runs on every PR, and this one must too: a job that is
  # skipped on a PR touching no `web-admin/` files reports nothing, and a
  # required check that reports nothing blocks the PR for ever. The install is
  # cached and the whole job is seconds; a path filter would buy nothing and
  # cost the gate.
  admin-frontend:
    name: Admin frontend (lint, types, test, build)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-admin/pnpm-lock.yaml
      # `--ignore-workspace` pins this install to web-admin/ alone. The repo
      # root carries no package.json today, so pnpm has nothing to walk up
      # into — but the day one appears (a shared tsconfig, a root tooling
      # package) an unflagged install would silently resolve the root project
      # instead and this job would install, lint and test nothing while
      # reporting green. The flag is what makes that impossible rather than
      # merely unlikely; it is the same trap the platform deploy workflow
      # documents for plugin `web/` directories.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm run lint
      - run: pnpm run typecheck
      # `vitest run` exits non-zero when it finds no test files, so this step
      # cannot pass by having quietly stopped collecting them.
      - run: pnpm run test
      # Build last: a bundle that type-checks but does not build is still a
      # broken admin UI, and web-admin/dist is what the consuming project
      # serves for `admin_ingress`.
      - run: pnpm run build

  validate-manifest:
    name: Validate biffo.plugin.json
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # Authoritative check: load_manifest() runs the *real* Pydantic model
      # (biffo_plugin_sdk.plugin.PluginManifest) that the SDK, the Core API's
      # discover_plugin_manifests(), and `biffo plugin install` all actually
      # validate against — same reasoning cli/src/lib/plugin-manifest.ts
      # documents for why the CLI validates this way rather than against
      # registry-schema.json directly (see the next step).
      - name: Validate against the SDK's PluginManifest model (authoritative)
        run: |
          uv run python -c "
          from biffo_plugin_sdk.plugin import load_manifest
          manifest = load_manifest('biffo.plugin.json')
          print(f'OK: {manifest.name}@{manifest.version} — '
                f'{len(manifest.tables)} table(s), {len(manifest.api_routes)} route(s)')
          "
      # Advisory check, not a gate: registry-schema.json (vendored from
      # _skeletons/registry/registry-schema.json in biffo-template) is the
      # nominal marketplace registry schema, but its api_routes shape
      # predates issue #19's table/operation CRUD-synthesis redesign — it
      # still requires a free-form `handler` function-name field, and its
      # `path` regex rejects the `{id}` path parameter every single-row
      # route (read/update/delete) is required to have. A manifest that is
      # valid per the real PluginManifest model above (checked and pinned in
      # this repo's uv.lock) will therefore *fail* strict validation here —
      # confirmed directly against this template's own example manifest.
      # Run non-blocking until the registry schema is corrected upstream;
      # see README.md's "Manifest validation" section for the full story.
      - name: Validate against the vendored registry schema (advisory, non-blocking)
        continue-on-error: true
        run: |
          uv run python -m jsonschema -i biffo.plugin.json registry-schema.json

  terraform:
    name: Terraform (fmt)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # This repo's `terraform/` module is checked by nothing else (#1244). The
    # skeleton shipped the module and no terraform step at all, so every plugin
    # repo was scaffolded with Terraform that nothing looked at — confirmed live
    # in biffo-plugin-idea-scout: three .tf files, zero terraform references
    # across three workflows.
    #
    # `scripts/verify.sh` cannot substitute for this job, and deliberately does
    # not try: its terraform check is guarded by `ci_has "terraform fmt"` so a
    # template-shipped gate never asserts over more than the repo's own CI does
    # (the #325 trap). A repo whose CI checks nothing therefore, correctly, gets
    # nothing locally either. This job is what switches the local gate on.
    #
    # ## Why there is no `terraform validate` here
    #
    # Not an oversight, and do not "fix" it by adding one. `terraform/main.tf`
    # sets `source = "../../cloud/aws/compute"`, a path relative to the module's
    # INSTALL location (`modules/plugins/<name>/` in the consuming monorepo),
    # not to this repo. `terraform init` in `terraform/` therefore fails with
    #
    #   Error: Unreadable module directory
    #   Unable to evaluate directory symlink: lstat ../../cloud: no such file
    #
    # before `validate` is ever reached — verified against this skeleton. The
    # module is validated where its paths resolve: by the consuming project's
    # own `infra-validate` job, after `biffo plugin install` has copied it into
    # place. See `terraform/README.md`, which has said so all along.
    #
    # fmt alone is not cosmetic. `terraform fmt -check` parses the HCL, so it
    # exits 2 on an unparseable file and 3 on a merely unformatted one — the
    # "a malformed .tf merges green" hole is closed by this step by itself.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

  security-secrets:
    name: Secret Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 cannot pass here, for two independent
      # reasons, and a generated plugin repo would be born permanently red:
      #
      #   1. On self-hosted runners the scan succeeds and the action then dies
      #      uploading its SARIF — it assumes a GitHub-hosted $HOME layout, and
      #      on the AWS fleet the workspace is not under $HOME.
      #   2. It requires a paid GITLEAKS_LICENSE for organization-owned repos
      #      (confirmed on tabsii-com/tabsii-platform and tabsii-com/tabsii-crm).
      #
      # Install the free, open-source CLI instead — the same approach this
      # template's own root ci.yml uses. Keep the two in step (issue #649).
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # --log-opts is load-bearing (issue #258). gitleaks defaults to `--all`,
      # so with fetch-depth: 0 the scan reaches commits that exist only on
      # unmerged branches — one bad commit on anyone's open branch then reddens
      # every open PR, with nothing in the built ref responsible for it.
      # Scoping to HEAD does not weaken detection: the full reachable history is
      # still walked, so a secret committed then removed is still caught.
      - name: gitleaks git history scan
        run: gitleaks detect --redact -v --exit-code=2 --log-opts="--full-history HEAD"
      # Second pass over the working tree. A generated repo's initial commit
      # contains every skeleton file, so a secret in an unchanged file would
      # pass the history scan and fail here. Running both closes the gap.
      - name: gitleaks filesystem scan
        run: gitleaks detect --no-git --redact -v --exit-code=2

  security-deps:
    name: Dependency Audit
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # A distributed *.test.sh with no caller anywhere in this file is only
      # half a guard: it ships, sits in the tree, and never runs, so CI is
      # green because the check never executed rather than because it passed
      # (biffo-plugin-marketing issue 193). Wired explicitly here, the same
      # way biffo-template wires each self-test by name in its own workflow,
      # because this repo does not yet carry template's `scripts/*.test.sh`
      # auto-discovery step (`scripts/guard-self-test-wiring.sh`) — that
      # reaches this repo via the ordinary shared-sync channel and should be
      # wired in behind it once it does, so this class is caught
      # automatically rather than one file at a time.
      #
      # Proves py-dependency-audit.sh distinguishes a finding this PR's diff
      # actually introduced from one that was already present on the base
      # branch unrelated to the diff — run before the real audit below, using
      # the same `sh` interpreter that invokes it in production, with a
      # stubbed `uv`/pip-audit so it needs no network access.
      - name: py-dependency-audit classification — self-test
        run: sh scripts/py-dependency-audit-classification.test.sh
      # Fails on a real advisory, but treats an unreachable PyPI/OSV as
      # INCONCLUSIVE rather than reddening a required check for an
      # infrastructure hiccup (#591, #743). The raw `uv run pip-audit` this
      # replaces exits non-zero identically whether it found a vulnerability or
      # simply could not reach the advisory database.
      #
      # The script is byte-identical to biffo-template's copy and to every other
      # satellite's, distributed by that repo's shared-sync.sh. Do not edit it
      # here; edit it upstream.
      - name: Dependency audit
        run: sh scripts/py-dependency-audit.sh
